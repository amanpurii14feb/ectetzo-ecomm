version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - env | grep -E 'DATABASE_URL|AUTH_SECRET|AUTH_TRUST_HOST|ADMIN_EMAIL|ADMIN_PASSWORD' >> .env.production
        - NEXT_TELEMETRY_DISABLED=1 npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*